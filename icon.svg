<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cuda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="rocm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#ed1c24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- CUDA Chip Icon Left -->
  <g transform="translate(60, 156)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="200" rx="18" fill="url(#cuda)"/>
    <text x="70" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">CUDA</text>
    <!-- Microchip Pins -->
    <rect x="-10" y="30" width="10" height="15" fill="#76b900" rx="3"/>
    <rect x="-10" y="70" width="10" height="15" fill="#76b900" rx="3"/>
    <rect x="-10" y="110" width="10" height="15" fill="#76b900" rx="3"/>
    <rect x="-10" y="150" width="10" height="15" fill="#76b900" rx="3"/>
  </g>

  <!-- Arrow Transition -->
  <g transform="translate(215, 230)" filter="url(#shadow)">
    <path d="M 10 26 L 50 26 L 50 10 L 80 40 L 50 70 L 50 54 L 10 54 Z" fill="#38bdf8"/>
  </g>

  <!-- ROCm Chip Icon Right -->
  <g transform="translate(312, 156)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="200" rx="18" fill="url(#rocm)"/>
    <text x="70" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">ROCm</text>
    <!-- Microchip Pins -->
    <rect x="140" y="30" width="10" height="15" fill="#ed1c24" rx="3"/>
    <rect x="140" y="70" width="10" height="15" fill="#ed1c24" rx="3"/>
    <rect x="140" y="110" width="10" height="15" fill="#ed1c24" rx="3"/>
    <rect x="140" y="150" width="10" height="15" fill="#ed1c24" rx="3"/>
  </g>
</svg>
